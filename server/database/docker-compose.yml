services:
  mongo_db:
    image: mongo:latest
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongo_data:/data/db

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    environment:
      MONGO_URL: mongodb://mongo_db:27017/dealershipsDB
      PORT: 3030
    depends_on:
      - mongo_db
    restart: on-failure

volumes:
  mongo_data:
